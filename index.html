<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cattle Farm Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen shadow-lg">

    <!-- Header -->
    <header class="bg-green-700 text-white p-4 text-center text-xl font-bold flex justify-between items-center">
        <span>فارم ڈیش بورڈ (Cattle Farm)</span>
        <i class="fas fa-cow text-2xl"></i>
    </header>

    <!-- Stats Section -->
    <div class="p-4 grid grid-cols-2 gap-4">
        <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-center shadow-sm">
            <i class="fas fa-paw text-blue-600 text-2xl mb-1"></i>
            <p class="text-xs text-gray-500">کُل مویشی</p>
            <h3 id="totalCattle" class="text-xl font-bold text-gray-800">2</h3>
        </div>
        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl text-center shadow-sm">
            <i class="fas fa-glass-water text-amber-600 text-2xl mb-1"></i>
            <p class="text-xs text-gray-500">آج کا دودھ</p>
            <h3 id="todayMilk" class="text-xl font-bold text-gray-800">25 L</h3>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="p-4">
        <h2 class="text-base font-bold text-gray-700 mb-3">اہم فیچرز (Main Features)</h2>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="showSection('addCattle')" class="bg-green-100 text-green-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-green-200">
                <i class="fas fa-plus-circle text-xl text-green-700"></i>
                <span class="text-xs">نیا جانور ایڈ کریں</span>
            </button>
            <button onclick="showSection('milkEntry')" class="bg-amber-100 text-amber-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-amber-200">
                <i class="fas fa-bucket text-xl text-amber-700"></i>
                <span class="text-xs">دودھ کی اینٹری</span>
            </button>
            <button onclick="showSection('cattleList')" class="bg-teal-100 text-teal-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-teal-200">
                <i class="fas fa-list text-xl text-teal-700"></i>
                <span class="text-xs">جانوروں کی لسٹ</span>
            </button>
            <button onclick="showSection('finance')" class="bg-purple-100 text-purple-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-purple-200">
                <i class="fas fa-wallet text-xl text-purple-700"></i>
                <span class="text-xs">مالیاتی لاگ</span>
            </button>
        </div>
    </div>

    <!-- Dynamic Section Container -->
    <div id="contentSection" class="p-4 border-t">
        <p class="text-center text-gray-500 text-sm">اوپر دیے گئے فیچرز پر کلک کر کے اینٹری کریں یا ریکارڈ دیکھیں۔</p>
    </div>

    <script>
        // In-Memory App Database
        let cattle = [
            { tag: 'TAG-101', breed: 'ساہیوال', category: 'Milking' },
            { tag: 'TAG-102', breed: 'فریزین', category: 'Milking' }
        ];
        let totalMilkLiters = 25;
        let transactions = [];

        function showSection(section) {
            const container = document.getElementById('contentSection');
            
            if (section === 'addCattle') {
                container.innerHTML = `
                    <h3 class="font-bold text-gray-700 mb-2">نیا جانور شامل کریں</h3>
                    <input id="tagNum" type="text" placeholder="ٹیگ نمبر (Tag Number)" class="w-full p-2 border rounded mb-2 text-sm">
                    <input id="breed" type="text" placeholder="نسل (Breed)" class="w-full p-2 border rounded mb-2 text-sm">
                    <button onclick="saveCattle()" class="w-full bg-green-600 text-white p-2 rounded text-sm font-bold">محفوظ کریں</button>
                `;
            } else if (section === 'milkEntry') {
                container.innerHTML = `
                    <h3 class="font-bold text-gray-700 mb-2">دودھ کا ریکارڈ درج کریں</h3>
                    <input id="milkLiters" type="number" placeholder="مقدار (لیٹر میں)" class="w-full p-2 border rounded mb-2 text-sm">
                    <button onclick="saveMilk()" class="w-full bg-amber-600 text-white p-2 rounded text-sm font-bold">محفوظ کریں</button>
                `;
            } else if (section === 'cattleList') {
                let listHtml = '<h3 class="font-bold text-gray-700 mb-2">تمام مویشی</h3><ul class="space-y-2">';
                cattle.forEach((c, index) => {
                    listHtml += `<li class="p-2 bg-gray-50 border rounded text-xs flex justify-between">
                        <span><b>${index + 1}.</b> ٹیگ: ${c.tag}</span>
                        <span>نسل: ${c.breed}</span>
                    </li>`;
                });
                listHtml += '</ul>';
                container.innerHTML = listHtml;
            } else if (section === 'finance') {
                container.innerHTML = `
                    <h3 class="font-bold text-gray-700 mb-2">مالیاتی حساب کتاب</h3>
                    <input id="amount" type="number" placeholder="رقم (RS)" class="w-full p-2 border rounded mb-2 text-sm">
                    <input id="desc" type="text" placeholder="تفصیل (Category)" class="w-full p-2 border rounded mb-2 text-sm">
                    <button onclick="saveFinance()" class="w-full bg-purple-600 text-white p-2 rounded text-sm font-bold">محفوظ کریں</button>
                `;
            }
        }

        function saveCattle() {
            const tag = document.getElementById('tagNum').value;
            const breed = document.getElementById('breed').value || 'نامعلوم';
            if (tag) {
                cattle.push({ tag, breed, category: 'General' });
                document.getElementById('totalCattle').innerText = cattle.length;
                alert('جانور کامیابی سے ایڈ ہو گیا!');
                showSection('cattleList');
            }
        }

        function saveMilk() {
            const liters = parseFloat(document.getElementById('milkLiters').value);
            if (liters) {
                totalMilkLiters += liters;
                document.getElementById('todayMilk').innerText = totalMilkLiters + ' L';
                alert('دودھ کا ریکارڈ محفوظ ہو گیا!');
                document.getElementById('contentSection').innerHTML = '<p class="text-center text-green-600 text-sm">ریکارڈ ایڈ ہو گیا!</p>';
            }
        }

        function saveFinance() {
            const amount = document.getElementById('amount').value;
            const desc = document.getElementById('desc').value;
            if (amount && desc) {
                alert('حساب درج ہو گیا!');
                document.getElementById('contentSection').innerHTML = '<p class="text-center text-purple-600 text-sm">مالیاتی لاگ محفوظ ہو گیا!</p>';
            }
        }
    </script>
</body>
</html>
