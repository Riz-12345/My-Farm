<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cattle Farm Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-10">

    <!-- Header -->
    <header class="bg-green-700 text-white p-4 text-center text-xl font-bold flex justify-between items-center shadow">
        <span>فارم ڈیش بورڈ (Cattle Farm)</span>
        <i class="fas fa-cow text-2xl"></i>
    </header>

    <!-- Stats Section -->
    <div class="p-4 grid grid-cols-2 gap-4">
        <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-center shadow-sm">
            <i class="fas fa-paw text-blue-600 text-2xl mb-1"></i>
            <p class="text-xs text-gray-500">کُل مویشی</p>
            <h3 id="totalCattle" class="text-xl font-bold text-gray-800">3</h3>
        </div>
        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl text-center shadow-sm">
            <i class="fas fa-glass-water text-amber-600 text-2xl mb-1"></i>
            <p class="text-xs text-gray-500">آج کا دودھ</p>
            <h3 id="todayMilk" class="text-xl font-bold text-gray-800">25 L</h3>
        </div>
    </div>

    <!-- Quick Actions Grid -->
    <div class="p-4">
        <h2 class="text-base font-bold text-gray-700 mb-3">اہم فیچرز (Main Features)</h2>
        <div class="grid grid-cols-3 gap-2">
            <button onclick="showSection('addCattle')" class="bg-green-100 text-green-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-green-200">
                <i class="fas fa-plus-circle text-lg text-green-700"></i>
                <span class="text-[11px] font-bold">نیا جانور</span>
            </button>
            <button onclick="showSection('milkEntry')" class="bg-amber-100 text-amber-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-amber-200">
                <i class="fas fa-bucket text-lg text-amber-700"></i>
                <span class="text-[11px] font-bold">دودھ اینٹری</span>
            </button>
            <button onclick="showSection('breeding')" class="bg-rose-100 text-rose-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-rose-200">
                <i class="fas fa-heart text-lg text-rose-700"></i>
                <span class="text-[11px] font-bold">بریڈنگ / پریگننسی</span>
            </button>
            <button onclick="showSection('health')" class="bg-red-100 text-red-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-red-200">
                <i class="fas fa-notes-medical text-lg text-red-700"></i>
                <span class="text-[11px] font-bold">صحت / بیماری</span>
            </button>
            <button onclick="showSection('cattleList')" class="bg-teal-100 text-teal-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-teal-200">
                <i class="fas fa-list text-lg text-teal-700"></i>
                <span class="text-[11px] font-bold">جانور لسٹ</span>
            </button>
            <button onclick="showSection('finance')" class="bg-purple-100 text-purple-800 p-3 rounded-lg font-medium flex flex-col items-center justify-center gap-1 hover:bg-purple-200">
                <i class="fas fa-wallet text-lg text-purple-700"></i>
                <span class="text-[11px] font-bold">مالیات</span>
            </button>
        </div>
    </div>

    <!-- Dynamic Section Container -->
    <div id="contentSection" class="p-4 border-t bg-gray-50 min-h-[250px]">
        <p class="text-center text-gray-500 text-sm mt-4">اوپر دیے گئے فیچرز میں سے کوئی منتخب کریں!</p>
    </div>

    <script>
        // Database Array
        let cattle = [
            { tag: 'TAG-101', breed: 'ساہیوال', health: 'صحت مند', pregnancy: 'غیر گبھن' },
            { tag: 'TAG-102', breed: 'فریزین', health: 'بخار (علاج جاری)', pregnancy: 'پریگننٹ (3 ماہ)' },
            { tag: 'Cow 101', breed: 'Aus', health: 'صحت مند', pregnancy: 'ہیٹ کی تاریخ قریب' }
        ];
        let totalMilkLiters = 25;
        let breedingRecords = [];
        let healthRecords = [];

        function getTagOptions() {
            return cattle.map(c => `<option value="${c.tag}">${c.tag} (${c.breed})</option>`).join('');
        }

        function showSection(section) {
            const container = document.getElementById('contentSection');
            
            if (section === 'addCattle') {
                container.innerHTML = `
                    <h3 class="font-bold text-gray-700 mb-2 text-sm">نیا جانور شامل کریں</h3>
                    <input id="tagNum" type="text" placeholder="ٹیگ نمبر (Tag Number)" class="w-full p-2 border rounded mb-2 text-sm">
                    <input id="breed" type="text" placeholder="نسل (Breed)" class="w-full p-2 border rounded mb-2 text-sm">
                    <button onclick="saveCattle()" class="w-full bg-green-600 text-white p-2 rounded text-sm font-bold shadow">محفوظ کریں</button>
                `;
            } 
            else if (section === 'milkEntry') {
                container.innerHTML = `
                    <h3 class="font-bold text-gray-700 mb-2 text-sm">دودھ کا ریکارڈ درج کریں</h3>
                    <select id="milkTag" class="w-full p-2 border rounded mb-2 text-sm">${getTagOptions()}</select>
                    <input id="milkLiters" type="number" placeholder="مقدار (لیٹر میں)" class="w-full p-2 border rounded mb-2 text-sm">
                    <button onclick="saveMilk()" class="w-full bg-amber-600 text-white p-2 rounded text-sm font-bold shadow">محفوظ کریں</button>
                `;
            } 
            else if (section === 'breeding') {
                container.innerHTML = `
                    <h3 class="font-bold text-rose-700 mb-2 text-sm">بریڈنگ اور پریگننسی ریکارڈ</h3>
                    <label class="text-xs text-gray-600 font-bold">جانور منتخب کریں:</label>
                    <select id="breedTag" class="w-full p-2 border rounded mb-2 text-sm">${getTagOptions()}</select>
                    
                    <label class="text-xs text-gray-600 font-bold">سٹیٹس / مرحلہ:</label>
                    <select id="breedStage" class="w-full p-2 border rounded mb-2 text-sm">
                        <option value="Heat">ہیٹ (Heat In Progress)</option>
                        <option value="Mating">میٹنگ / AI کراس کروایا</option>
                        <option value="Pregnant">پریگننٹ کنفرم (Pregnant)</option>
                        <option value="Delivered">بچہ دے دیا (Delivered)</option>
                    </select>

                    <label class="text-xs text-gray-600 font-bold">تاریخ:</label>
                    <input id="breedDate" type="date" class="w-full p-2 border rounded mb-2 text-sm">
                    <textarea id="breedNote" placeholder="اضافی تفصیل (مثلاً: کس بول/سیمن سے کراس کروایا)" class="w-full p-2 border rounded mb-2 text-sm"></textarea>
                    
                    <button onclick="saveBreeding()" class="w-full bg-rose-600 text-white p-2 rounded text-sm font-bold shadow">ریکارڈ محفوظ کریں</button>
                `;
            }
            else if (section === 'health') {
                container.innerHTML = `
                    <h3 class="font-bold text-red-700 mb-2 text-sm">بیماری اور علاج کا ریکارڈ</h3>
                    <label class="text-xs text-gray-600 font-bold">جانور منتخب کریں:</label>
                    <select id="healthTag" class="w-full p-2 border rounded mb-2 text-sm">${getTagOptions()}</select>
                    
                    <input id="disease" type="text" placeholder="بیماری / علامات (مثلاً: بخار، ورم)" class="w-full p-2 border rounded mb-2 text-sm">
                    <input id="medicine" type="text" placeholder="دی گئی دوا / ویکسین" class="w-full p-2 border rounded mb-2 text-sm">
                    <input id="doctor" type="text" placeholder="ڈاکٹر کا نام (اختاری)" class="w-full p-2 border rounded mb-2 text-sm">
                    
                    <button onclick="saveHealth()" class="w-full bg-red-600 text-white p-2 rounded text-sm font-bold shadow">ریکارڈ محفوظ کریں</button>
                `;
            }
            else if (section === 'cattleList') {
                let listHtml = '<h3 class="font-bold text-gray-700 mb-2 text-sm">تمام مویشی</h3><div class="space-y-2">';
                cattle.forEach((c, index) => {
                    listHtml += `
                        <div class="p-3 bg-white border rounded-lg shadow-sm text-xs">
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-sm text-green-800">${index + 1}. ٹیگ: ${c.tag}</span>
                                <span class="bg-gray-100 px-2 py-0.5 rounded text-gray-600">${c.breed}</span>
                            </div>
                            <div class="text-gray-600 space-y-1">
                                <p><i class="fas fa-heart text-rose-500 mr-1"></i> <b>بریڈنگ:</b> ${c.pregnancy || 'نارمل'}</p>
                                <p><i class="fas fa-notes-medical text-red-500 mr-1"></i> <b>صحت:</b> ${c.health || 'صحت مند'}</p>
                            </div>
                        </div>`;
                });
                listHtml += '</div>';
                container.innerHTML = listHtml;
            } 
            else if (section === 'finance') {
                container.innerHTML = `
                    <h3 class="font-bold text-purple-700 mb-2 text-sm">مالیاتی لاگ</h3>
                    <input id="amount" type="number" placeholder="رقم (RS)" class="w-full p-2 border rounded mb-2 text-sm">
                    <input id="desc" type="text" placeholder="تفصیل (چارہ، ادویات، یا فروخت)" class="w-full p-2 border rounded mb-2 text-sm">
                    <button onclick="saveFinance()" class="w-full bg-purple-600 text-white p-2 rounded text-sm font-bold shadow">محفوظ کریں</button>
                `;
            }
        }

        function saveCattle() {
            const tag = document.getElementById('tagNum').value;
            const breed = document.getElementById('breed').value || 'نامعلوم';
            if (tag) {
                cattle.push({ tag, breed, health: 'صحت مند', pregnancy: 'غیر گبھن' });
                document.getElementById('totalCattle').innerText = cattle.length;
                alert('جانور کامیابی سے ایڈ ہو گیا!');
                showSection('cattleList');
            }
        }

        function saveMilk() {
            const liters = parseFloat(document.getElementById('milkLiters').value);
            if (liters) {
                totalMilkLiters += liters;
                document.getElementById('todayMilk').innerText = totalMilkLiters + ' L';
                alert('دودھ کا ریکارڈ محفوظ ہو گیا!');
                showSection('cattleList');
            }
        }

        function saveBreeding() {
            const tag = document.getElementById('breedTag').value;
            const stage = document.getElementById('breedStage').value;
            const date = document.getElementById('breedDate').value;
            
            let item = cattle.find(c => c.tag === tag);
            if(item) {
                item.pregnancy = `${stage} (${date || 'آج'})`;
                alert(`ٹیگ ${tag} کا بریڈنگ ریکارڈ محفوظ ہو گیا!`);
                showSection('cattleList');
            }
        }

        function saveHealth() {
            const tag = document.getElementById('healthTag').value;
            const disease = document.getElementById('disease').value;
            
            let item = cattle.find(c => c.tag === tag);
            if(item) {
                item.health = disease ? disease : 'علاج شدہ';
                alert(`ٹیگ ${tag} کی میڈیکل ہسٹری محفوظ ہو گئی!`);
                showSection('cattleList');
            }
        }

        function saveFinance() {
            const amount = document.getElementById('amount').value;
            if (amount) {
                alert('حساب درج ہو گیا!');
                showSection('cattleList');
            }
        }
    </script>
</body>
</html>
